<style>
  :root{ --bg:#f4f1ea; --card:#ffffff; --ink:#2b2b2b; --muted:#6b6b6b; --wine:#7b1e3b; --line:#e6e0d6; --ok:#1b7a3d; --err:#b3261e; }
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:0;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 60px}
  header{padding:8px 0 6px}
  .brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--wine);font-weight:700}
  #langbar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
  #langbar button{border:1px solid var(--line);background:#fff;color:#555;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer}
  #langbar button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
  .intro{background:var(--card);border-radius:14px;padding:18px 18px;margin:12px 0 22px;box-shadow:0 3px 14px rgba(0,0,0,.05);white-space:pre-line;font-size:15px;color:#3a3a3a}
  .q{background:var(--card);border-radius:14px;padding:18px 18px 16px;margin:0 0 14px;box-shadow:0 3px 14px rgba(0,0,0,.05);scroll-margin-top:16px}
  .q.hidden{display:none}
  .q h3{font-size:16px;margin:0 0 4px;font-weight:650}
  .q .req{color:var(--wine);margin-left:3px}
  .q .hint{font-size:12.5px;color:var(--muted);margin:0 0 10px}
  label.opt{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin:7px 0;cursor:pointer;font-size:14.5px;transition:border-color .12s,background .12s}
  label.opt:hover{border-color:#cdbfae}
  label.opt input{margin-top:2px;flex:0 0 auto;width:18px;height:18px;accent-color:var(--wine)}
  label.opt.sel{border-color:var(--wine);background:#fbf3f5}
  input[type=text],input[type=email],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;margin-top:4px}
  input:focus,select:focus{outline:none;border-color:var(--wine)}
  .gdpr{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
  .otro{margin-top:6px}
  .warn{color:var(--err);font-size:13px;margin-top:8px;display:none;font-weight:600}
  .warn.show{display:block}
  .submit{background:var(--wine);color:#fff;border:0;font-size:17px;font-weight:600;padding:16px;border-radius:12px;width:100%;cursor:pointer;margin-top:8px}
  .submit:disabled{opacity:.6}
  .hp{position:absolute!important;left:-9999px!important;top:auto;width:1px;height:1px;overflow:hidden}
  .msg-global{color:var(--err);font-size:14px;font-weight:600;margin:10px 2px;min-height:20px}
  #gracias{display:none;text-align:center;background:var(--card);border-radius:16px;padding:36px 22px;box-shadow:0 4px 18px rgba(0,0,0,.07);margin-top:26px}
  #gracias h2{color:var(--wine);font-size:22px;margin:6px 0 10px}
  #gracias p{font-size:15.5px;color:#444;margin:0 0 20px}
  #gracias a.btn{display:inline-block;background:var(--wine);color:#fff;text-decoration:none;padding:14px 26px;border-radius:12px;font-size:16px;font-weight:600}
  .dev{font-size:11px;color:#b7ae9f;text-align:center;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <div id="encuesta">
    <header><div class="brand">Penedés</div></header>
    <div id="langbar"></div>
    <div class="intro" id="intro"></div>
    <form id="form" novalidate></form>
    <div class="hp" aria-hidden="true"><label>No rellenar / Do not fill<input type="text" id="hp_url" name="hp_url" tabindex="-1" autocomplete="off"></label></div>
    <div class="dev" id="privacyNote" style="margin-top:14px"></div>
    <div class="msg-global" id="msgGlobal"></div>
    <button type="button" class="submit" id="btnSend">Enviar</button>
  </div>
  <div id="gracias">
    <div style="font-size:40px">🍇</div>
    <h2 id="grTitle"></h2>
    <p id="grText"></p>
    <a class="btn" id="grLink" href="#" target="_blank" rel="noopener">→</a>

 de:{
  brand:"Penedés · Studie",
  intro:"Hallo! Hast du 2–3 Minuten?\n\nWir erforschen, wie Menschen Tagesausflüge und Auszeiten aufs Land wählen. Unser Hauptbeispiel ist die schöne Region Penedés bei Barcelona, bekannt für ihre Weingüter, ihre Geschichte und ihre Natur.\n\nEgal, wo du wohnst oder ob du schon in Katalonien warst:\n• ob einheimisch oder zugezogen — uns interessiert, wie du deine Freizeit in der Nähe verbringst;\n• wohnst du in einem anderen Land oder hörst «Penedés» zum ersten Mal — uns interessiert, wie du solche Ausflüge planst.\n\nDie Umfrage ist anonym. Am Ende ein Geschenk für alle: ein fertiger Ein-Tages-Guide für Sant Sadurní d'Anoia. E-Mail optional, am Ende.",
  q1:{label:"Für die Karte: In welchem Land und welcher Region/welchem Bundesland wohnst du?", ph:"z. B. Deutschland, Berlin"},
  q2:{label:"Wo wohnst du?", options:["Im Penedés (Vilafranca, Sant Sadurní, Vilanova und Umgebung)","In oder bei Barcelona","Woanders in Katalonien (Girona/Costa Brava, Tarragona, Lleida…)","In einer anderen Region Spaniens","In einem anderen Land"]},

 uk:{
  brand:"Пенедес · Дослідження",
  intro:"Привіт! Маєш 2–3 хвилини?\n\nМи досліджуємо, як люди обирають одноденні поїздки та відпочинок за містом. Наш головний приклад — мальовничий регіон Пенедес (Penedés) біля Барселони, відомий своїми винарнями, історією та природою.\n\nНеважливо, де ти живеш і чи був у Каталонії:\n• місцевий чи експат — нам цікавий твій досвід відпочинку поряд із домом;\n• живеш в іншій країні або чуєш «Пенедес» уперше — нам важливо зрозуміти, як ти зазвичай плануєш такі поїздки.\n\nОпитування анонімне. Наприкінці на всіх чекає подарунок — готовий путівник на один день по містечку Sant Sadurní d'Anoia. Email — за бажанням, у самому кінці.",
  q1:{label:"Для карти: у якій країні та регіоні/області ти живеш?", ph:"Наприклад: Україна, Київ, Бровари"},
  q2:{label:"Де ти живеш?", options:["У Пенедес (Vilafranca, Sant Sadurní, Vilanova і довкола)","У Барселоні або поряд","В іншій частині Каталонії (Жирона/Коста-Брава, Таррагона, Льєйда…)","В іншому регіоні Іспанії","В іншій країні"]},
  a1:{label:"Винарні поруч із тобою — ти їх знаєш?", options:["Так, можу назвати — бував там","Знаю, що є, але пригадати не можу","Ні, не знаю таких — і це нормально"]},
  a2:{label:"Якщо можеш — впиши яку.", ph:"Назва винарні"},
  a3:{label:"За останні 12 місяців бував на винарні чи дегустації в Каталонії?", options:["Так, у своїй зоні","Так, в іншій","Ні"]},

 ru:{
  brand:"Penedés · Исследование",
  intro:"Привет! Найдётся 2–3 минуты?\n\nМы исследуем, как люди выбирают однодневные поездки и отдых за городом. Наш главный пример — живописный регион Пенедес (Penedés) под Барселоной, знаменитый винодельнями, историей и природой.\n\nНеважно, где ты живёшь и был ли в Каталонии:\n• местный или экспат — нам интересен твой опыт отдыха рядом с домом;\n• живёшь в другой стране или слышишь о Пенедесе впервые — нам важно, как ты вообще планируешь такие поездки.\n\nОпрос анонимный. В конце всех ждёт подарок — готовый гид на один день по городку Sant Sadurní d'Anoia. Email — по желанию, в самом конце.",

  edad:{label:"Возраст", options:["18–25","26–35","36–45","46–55","56–65","65+","Не хочу указывать"]},
  genero:{label:"Пол", options:["Мужской","Женский","Другое","Не хочу указывать"]},
  ui:{required:"Пожалуйста, ответь на отмеченные вопросы ↑", max:"Можно выбрать не больше трёх", emailBad:"Проверь адрес email", sending:"Отправляю…", send:"Отправить ответы", thanksTitle:"Спасибо!", thanksGift:"Твой подарок — гид «{guia}».", openGuide:"Открыть гид →"}
 }
};

/* ===== 4. ДВИЖОК ===== */
function qs(s){ return new URLSearchParams(location.search).get(s) || ""; }
var LANG = (qs("lang") || (navigator.language||"es").slice(0,2)).toLowerCase();
if(!DICT[LANG]) LANG = "es";
var T = DICT[LANG];
var WHO = qs("who");
var CHANNEL = qs("channel");
var SID = qs("sid") || genSid();
function genSid(){ try{ return crypto.randomUUID(); }catch(e){ return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); } }
document.documentElement.lang = LANG;

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
var branch = null;

document.querySelector(".brand").textContent = T.brand;
document.getElementById("intro").textContent = T.intro;
document.getElementById("btnSend").textContent = T.ui.send;

/* --- панель языков --- */
(function(){
  var bar=document.getElementById("langbar");
  LANG_ORDER.forEach(function(l){
    var b=document.createElement("button"); b.textContent=LANG_NAMES[l];
    if(l===LANG) b.className="on";
    b.addEventListener("click", function(){ var p=new URLSearchParams(location.search); p.set("lang", l); location.search=p.toString(); });
    bar.appendChild(b);
  });
})();

var form = document.getElementById("form");

QUESTIONS.forEach(function(q){
  var d = T[q.id]; if(!d) return;
  var box = document.createElement("div");
  box.className = "q"; box.id = "q_"+q.id;
  if(q.branch==="A" || q.branch==="B") box.classList.add("hidden");

  var h = document.createElement("h3");
  h.innerHTML = esc(d.label) + (q.required ? '<span class="req">*</span>' : '');
  box.appendChild(h);
  if(d.hint){ var hint=document.createElement("div"); hint.className="hint"; hint.textContent=d.hint; box.appendChild(hint); }

  if(q.type==="text"){
    var inp=document.createElement("input"); inp.type="text"; inp.name=q.id; if(d.ph) inp.placeholder=d.ph;
    box.appendChild(inp);
  } else if(q.type==="email"){
    var ie=document.createElement("input"); ie.type="email"; ie.name=q.id; if(d.ph) ie.placeholder=d.ph;
    box.appendChild(ie);
    if(d.gdpr){ var g=document.createElement("div"); g.className="gdpr"; g.textContent=d.gdpr; box.appendChild(g); }
  } else if(q.type==="select"){
    var sel=document.createElement("select"); sel.name=q.id;
    var o0=document.createElement("option"); o0.value=""; o0.textContent="—"; sel.appendChild(o0);
    d.options.forEach(function(op){ var o=document.createElement("option"); o.value=op; o.textContent=op; sel.appendChild(o); });
    box.appendChild(sel);
  } else {
    var opts = q.shuffle ? shuffle(d.options) : d.options;
    opts.forEach(function(op){ box.appendChild(makeOpt(q, op)); });
    if(q.other){
      box.appendChild(makeOpt(q, d.other, true));
      var extra=document.createElement("input"); extra.type="text"; extra.className="otro"; extra.name=q.id+"_otro"; extra.placeholder="…"; extra.style.display="none"; extra.id="otro_"+q.id;
      box.appendChild(extra);
    }
    var warn=document.createElement("div"); warn.className="warn"; warn.id="warn_"+q.id; warn.textContent=T.ui.max;
    box.appendChild(warn);
  }
  form.appendChild(box);
});

function makeOpt(q, text, isOther){
  var lab=document.createElement("label"); lab.className="opt";
  var inp=document.createElement("input");
  inp.type = (q.type==="checkbox") ? "checkbox" : "radio";
  inp.name = q.id; inp.value = isOther ? "__OTRO__" : text;
  var span=document.createElement("span"); span.textContent=text;
  lab.appendChild(inp); lab.appendChild(span);
  inp.addEventListener("change", function(){
    if(q.type==="radio"){
      form.querySelectorAll('input[name="'+q.id+'"]').forEach(function(x){ x.closest("label").classList.toggle("sel", x.checked); });
    } else { lab.classList.toggle("sel", inp.checked); }
    if(q.max){
      var checked=form.querySelectorAll('input[name="'+q.id+'"]:checked');
      var w=document.getElementById("warn_"+q.id);
      if(checked.length > q.max){ inp.checked=false; lab.classList.remove("sel"); if(w){ w.classList.add("show"); setTimeout(function(){ w.classList.remove("show"); },2500); } }
    }
    if(isOther){ var ex=document.getElementById("otro_"+q.id); if(ex) ex.style.display = inp.checked ? "block":"none"; }
    if(q.fork){ applyFork(inp.value); }
  });
  return lab;
}

function applyFork(val){
  branch = (val === DICT[LANG].q2.options[0]) ? "A" : "B";
  QUESTIONS.forEach(function(q){
    if(q.branch==="A") document.getElementById("q_"+q.id).classList.toggle("hidden", branch!=="A");
    if(q.branch==="B") document.getElementById("q_"+q.id).classList.toggle("hidden", branch!=="B");
  });
}

document.getElementById("btnSend").addEventListener("click", enviar);
function visible(q){ return q.branch==="all" || q.branch===branch; }

function enviar(){
  var hp=document.getElementById("hp_url"); if(hp && hp.value){ mostrarGracias(); return; }
  var msg=document.getElementById("msgGlobal"); msg.textContent="";
  var firstBad=null;
  for(var i=0;i<QUESTIONS.length;i++){
    var q=QUESTIONS[i]; if(!visible(q) || !q.required || q.type==="email") continue;
    if(!getVal(q)){ if(!firstBad) firstBad=q; }
  }
  var em=form.querySelector('input[name="email"]');
  if(em && em.value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value)){
    msg.textContent=T.ui.emailBad; em.scrollIntoView({behavior:"smooth",block:"center"}); return;
  }
  if(firstBad){
    msg.textContent=T.ui.required;
    document.getElementById("q_"+firstBad.id).scrollIntoView({behavior:"smooth",block:"center"}); return;
  }
  var data={ sid:SID, idioma:LANG, who:WHO, channel:CHANNEL };
  QUESTIONS.forEach(function(q){
    data[q.id] = visible(q) ? getVal(q) : "";
    if(q.other){ var ex=document.getElementById("otro_"+q.id); data[q.id+"_otro"] = (visible(q)&&ex)?ex.value:""; }
  });
  var btn=document.getElementById("btnSend"); btn.disabled=true; btn.textContent=T.ui.sending;
  fetch(URL_RECEPTOR,{ method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(data) })
    .then(function(){ mostrarGracias(); }).catch(function(){ mostrarGracias(); });
}

function getVal(q){
  if(q.type==="text"||q.type==="email"){ var e=form.querySelector('[name="'+q.id+'"]'); return e?e.value.trim():""; }
  if(q.type==="select"){ var s=form.querySelector('[name="'+q.id+'"]'); return s?s.value:""; }
  if(q.type==="radio"){ var r=form.querySelector('input[name="'+q.id+'"]:checked'); return r?r.value:""; }
  if(q.type==="checkbox"){
    var arr=[]; form.querySelectorAll('input[name="'+q.id+'"]:checked').forEach(function(x){
      if(x.value==="__OTRO__"){ var ex=document.getElementById("otro_"+q.id); var ol=(T[q.id]&&T[q.id].other)?T[q.id].other:"Otro:"; arr.push(ol+" "+(ex?ex.value:"")); }
      else arr.push(x.value);
    });
    return arr.join(" · ");
  }
  return "";
}

function mostrarGracias(){
  document.getElementById("encuesta").style.display="none";
  var g=GUIAS[LANG]||GUIAS.es;
  document.getElementById("grTitle").textContent=T.ui.thanksTitle;
  document.getElementById("grText").textContent=T.ui.thanksGift.replace("{guia}", g.name);
  var sep=(g.url.indexOf("?")>=0)?"&":"?";
  var extra="sid="+encodeURIComponent(SID)+"&lang="+encodeURIComponent(LANG)+(WHO?"&who="+encodeURIComponent(WHO):"")+(CHANNEL?"&channel="+encodeURIComponent(CHANNEL):"");
  var a=document.getElementById("grLink"); a.href=g.url+sep+extra; a.textContent=T.ui.openGuide;
  document.getElementById("gracias").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
document.getElementById("privacyNote").textContent = PRIV[LANG]||PRIV.es;
</script>
</body>
</html>
